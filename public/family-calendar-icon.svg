<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="家族カレンダー">
  <title>家族カレンダー</title>

  <!--
    家族カレンダーのオリジナルアイコン。
    白いカレンダー用紙 + 水色のアクセント。
    右側の2列は、アプリと同じ土曜日（薄い水色）・日曜日（薄いピンク）を表す。
    第三者の素材・イラスト・ロゴは使用していない。
  -->

  <!-- 背景（水色の角丸正方形） -->
  <rect width="512" height="512" rx="112" fill="#0288d1" />

  <!-- 綴じリング -->
  <rect x="148" y="44" width="30" height="72" rx="15" fill="#ffffff" />
  <rect x="334" y="44" width="30" height="72" rx="15" fill="#ffffff" />

  <!-- カレンダー用紙（白） -->
  <rect x="64" y="88" width="384" height="360" rx="32" fill="#ffffff" />

  <!-- 見出し帯（上の角だけ丸める） -->
  <path
    d="M64 120 a32 32 0 0 1 32 -32 h320 a32 32 0 0 1 32 32 v44 h-384 z"
    fill="#0277bd"
  />

  <!-- 日付マス 4列 × 3行 -->
  <g>
    <!-- 1行目 -->
    <rect x="100" y="192" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="180" y="192" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="260" y="192" width="72" height="64" rx="10" fill="#b3e5fc" />
    <rect x="340" y="192" width="72" height="64" rx="10" fill="#f9c9d8" />
    <!-- 2行目 -->
    <rect x="100" y="264" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="180" y="264" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="260" y="264" width="72" height="64" rx="10" fill="#b3e5fc" />
    <rect x="340" y="264" width="72" height="64" rx="10" fill="#f9c9d8" />
    <!-- 3行目 -->
    <rect x="100" y="336" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="180" y="336" width="72" height="64" rx="10" fill="#dfe6ec" />
    <rect x="260" y="336" width="72" height="64" rx="10" fill="#b3e5fc" />
    <rect x="340" y="336" width="72" height="64" rx="10" fill="#f9c9d8" />
  </g>
</svg>
