    <line x1="34" y1="60" x2="86" y2="60" />
    <line x1="47" y1="37.5" x2="73" y2="82.5" />
    <line x1="73" y1="37.5" x2="47" y2="82.5" />
    <path d="M60 42 l-6 7 M60 42 l6 7 M60 78 l-6 -7 M60 78 l6 -7" />
    <path d="M42 50 l1 8 M78 70 l-1 -8" />
