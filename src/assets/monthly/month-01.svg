  <!-- 梅の花 -->
  <g stroke="#56778c" stroke-width="2.6" stroke-linejoin="round">
    <circle cx="128" cy="39" r="10" fill="#dcaeb8" />
    <circle cx="140" cy="48" r="10" fill="#dcaeb8" />
    <circle cx="136" cy="63" r="10" fill="#dcaeb8" />
    <circle cx="120" cy="63" r="10" fill="#dcaeb8" />
    <circle cx="116" cy="48" r="10" fill="#dcaeb8" />
