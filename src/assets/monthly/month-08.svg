<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120" fill="none" aria-hidden="true" focusable="false">
  <!-- 8月：ひまわり・夏の日差し・小さな花火（オリジナル） -->
  <!-- ひまわり -->
  <g stroke="#a8842f" stroke-width="2.6" stroke-linejoin="round">
    <g fill="#e3c064">
      <ellipse cx="52" cy="26" rx="6" ry="12" />
      <ellipse cx="74" cy="35" rx="6" ry="12" transform="rotate(45 74 35)" />
      <ellipse cx="83" cy="57" rx="12" ry="6" />
      <ellipse cx="74" cy="79" rx="6" ry="12" transform="rotate(-45 74 79)" />
      <ellipse cx="52" cy="88" rx="6" ry="12" />
      <ellipse cx="30" cy="79" rx="6" ry="12" transform="rotate(45 30 79)" />
      <ellipse cx="21" cy="57" rx="12" ry="6" />
      <ellipse cx="30" cy="35" rx="6" ry="12" transform="rotate(-45 30 35)" />
    </g>
    <circle cx="52" cy="57" r="15" fill="#a8842f" />
  </g>
  <!-- 夏の日差し（塗りのある太陽＋まっすぐな光） -->
  <g stroke="#a8842f" stroke-width="3" stroke-linecap="round">
    <circle cx="130" cy="44" r="13" fill="#e3c064" />
    <path d="M130 22 v-8 M130 66 v8 M108 44 h-8 M152 44 h8" />
    <path d="M114.5 28.5 l-5.5 -5.5 M145.5 59.5 l5.5 5.5 M145.5 28.5 l5.5 -5.5 M114.5 59.5 l-5.5 5.5" />
  </g>
  <!-- 小さな花火（先端に小さな粒） -->
  <g stroke="#6fb0d4" stroke-width="3" stroke-linecap="round">
    <g transform="translate(196 66)">
      <path d="M0 -14 v-8 M0 14 v8 M-14 0 h-8 M14 0 h8" />
      <path d="M-10 -10 l-6 -6 M10 10 l6 6 M10 -10 l6 -6 M-10 10 l-6 6" />
      <g fill="#6fb0d4" stroke="none">
        <circle cx="0" cy="-25" r="2.6" /><circle cx="0" cy="25" r="2.6" />
        <circle cx="-25" cy="0" r="2.6" /><circle cx="25" cy="0" r="2.6" />
        <circle cx="-18" cy="-18" r="2.2" /><circle cx="18" cy="18" r="2.2" />
        <circle cx="18" cy="-18" r="2.2" /><circle cx="-18" cy="18" r="2.2" />
      </g>
      <circle cx="0" cy="0" r="4.5" fill="#e3c064" stroke="#a8842f" stroke-width="2.4" />
    </g>
  </g>
</svg>
