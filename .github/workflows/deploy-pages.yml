name: Deploy to GitHub Pages

on:
  # main へ push すると自動で再公開する
  push:
    branches: [main]
  # Actions 画面から手動でも実行できる
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # PWAのアイコンはリポジトリへコミット済みのため、ここでは生成しない
      # （アイコンを作り直したいときはローカルで npm run generate:pwa-assets を実行する）
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 公開するのは dist だけ（node_modules やプロジェクト全体は含めない）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
